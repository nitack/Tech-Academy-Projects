<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML and JavaScript</title>
</head>

<body>

<h1>Welcome to My First JavaScript Page</h1>

<p>
    <font face="Arial" size="2" color="blue">
        <b>This paragraph is bold, blue, and uses Arial size 2.</b>
    </font>
</p>

<p>
    <font face="Verdana" size="4" color="#FF0000">
        <i>This paragraph is italic, red, and uses Verdana size 4.</i>
    </font>
</p>

<p>
    <font face="Times New Roman" size="6" color="green">
        <u>This paragraph is underlined, green, and uses Times New Roman size 6.</u>
    </font>
</p>

<img src="dog.jpg" alt="A happy dog playing outside">

<script src="Basic_JavaScript_1.js"></script>

<p>Added another paragraph.</p>

</body>
</html>
