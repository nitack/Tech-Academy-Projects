<!DOCTYPE html>
<html>
<head>
    <title>Class Attribute Assignment</title>

    <style>
        .blue_text {
            color: blue;
        }

        .red_text {
            color: red;
        }

        .green_text {
            color: green;
        }

        .my_style {
            background-color: lightyellow;
            color: darkblue;
            font-weight: bold;
            text-decoration: underline;
            text-align: center;
        }
    </style>

</head>

<body>

<h1>Class Attribute Assignment</h1>

<p class="blue_text">This paragraph is blue.</p>

<p class="red_text">This paragraph is red.</p>

<p class="green_text">This paragraph is green.</p>

<p class="my_style">This paragraph uses my custom style.</p>

<p class="my_style">This paragraph also points to the my_style class.</p>

</body>
</html>
